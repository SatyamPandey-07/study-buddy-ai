version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: studybuddy_password
      POSTGRES_DB: studybuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://studybuddy:studybuddy_password@postgres:5432/studybuddy?schema=public
      NODE_ENV: production
      PORT: 3001
    env_file:
      - .env

volumes:
  postgres_data:
