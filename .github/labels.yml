# Source of truth for repo labels — synced automatically by
# .github/workflows/label-sync.yml whenever this file changes on main.

# Type
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation
- name: question
  color: "d876e3"
  description: Further information is requested
- name: chore
  color: "cfd3d7"
  description: Maintenance, tooling, or refactor work

# Triage / workflow
- name: needs-triage
  color: "fbca04"
  description: Needs a maintainer to review and label
- name: confirmed
  color: "0e8a16"
  description: Reproduced / validated by a maintainer
- name: wontfix
  color: "ffffff"
  description: This will not be worked on
- name: duplicate
  color: "cfd3d7"
  description: This issue or PR already exists
- name: stale
  color: "cfd3d7"
  description: No activity for a while — will be closed if inactive continues
- name: in-progress
  color: "fef2c0"
  description: Someone is actively working on this

# Difficulty / onboarding
- name: good first issue
  color: "7057ff"
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed

# Priority
- name: "priority: high"
  color: "b60205"
  description: Should be addressed soon
- name: "priority: medium"
  color: "fbca04"
  description: Normal priority
- name: "priority: low"
  color: "c2e0c6"
  description: Nice to have, no rush

# Area (matches .github/labeler.yml path rules)
- name: frontend
  color: "1d76db"
  description: React / Vite client code
- name: backend
  color: "5319e7"
  description: Express server / API routes
- name: database
  color: "0052cc"
  description: Prisma schema / migrations
- name: landing-page
  color: "c5def5"
  description: Marketing / landing page
- name: admin
  color: "e99695"
  description: Admin panel / RBAC
- name: auth
  color: "f9d0c4"
  description: Sign-in/up, Clerk integration
- name: ui-components
  color: "bfd4f2"
  description: shadcn/ui component library
- name: dependencies
  color: "0366d6"
  description: Package/dependency changes
- name: ci/cd
  color: "000000"
  description: GitHub Actions, deploy config
- name: config
  color: "d4c5f9"
  description: Build/tooling configuration

# Security
- name: security
  color: "b60205"
  description: Security-related issue
