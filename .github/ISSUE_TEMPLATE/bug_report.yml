name: 🐛 Bug Report
description: Something isn't working the way it should
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search [existing issues](../../issues) first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click "Generate Quiz" on the Quiz module, the app crashes with a blank screen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Which part of the app?
      multiple: true
      options:
        - Explain Concept
        - Summarizer
        - Quiz Generator
        - Flashcards
        - Pomodoro Timer
        - Resource Library
        - Stats / Analytics
        - Admin Panel
        - Auth (sign in/up)
        - Landing page
        - API / Server
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console / server logs
      description: Paste any relevant browser console or server logs. This will be rendered as code automatically.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS: Windows 11, Browser: Chrome 128, Node: 20.x"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues and this isn't a duplicate
          required: true
        - label: I've read the [CONTRIBUTING.md](../CONTRIBUTING.md) guide
          required: false
