name: ✨ Feature Request
description: Suggest an idea or improvement for Study Buddy AI
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check [existing issues](../../issues) and the roadmap first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is this related to something frustrating or missing today?
      placeholder: There's no way to export flashcards to Anki, so I have to re-create them elsewhere.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've thought about?
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: Which part of the app does this affect?
      multiple: true
      options:
        - Explain Concept
        - Summarizer
        - Quiz Generator
        - Flashcards
        - Pomodoro Timer
        - Resource Library
        - Stats / Analytics
        - Admin Panel
        - Auth (sign in/up)
        - Landing page
        - API / Server
        - New module / area
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Are you willing to work on this?
      options:
        - label: I'd like to implement this myself (comment "I'd like to work on this" to get it assigned)
          required: false
